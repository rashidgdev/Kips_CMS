{% load common_extras %}
{% if is_paginated %}
<div class="mt-4 flex items-center justify-between border-t border-gray-100 pt-4 text-sm text-gray-500">
    {% if page_obj.has_previous %}
        <a href="{% paginate_url page_obj.previous_page_number page_param|default:'page' %}" class="link">&laquo; Previous</a>
    {% else %}<span></span>{% endif %}
    <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
        <a href="{% paginate_url page_obj.next_page_number page_param|default:'page' %}" class="link">Next &raquo;</a>
    {% else %}<span></span>{% endif %}
</div>
{% endif %}
