{% load icons %}
<a href="{{ url }}" class="card-link group">
    <span class="stat-icon mb-3 {{ color|default:'bg-blue-50 text-blue-700' }}">
        {% icon icon 'h-5 w-5' %}
    </span>
    <h3 class="mb-1 font-semibold text-gray-900 transition-colors group-hover:text-blue-800">{{ title }}</h3>
    <p class="text-sm text-gray-500">{{ description }}</p>
</a>
