{% load icons %}
{% if href %}<a href="{{ href }}" class="stat-tile">{% else %}<div class="stat-tile">{% endif %}
    <span class="stat-icon {{ color|default:'bg-blue-50 text-blue-700' }}">
        {% icon icon 'h-5 w-5' %}
    </span>
    <div class="min-w-0 flex-1">
        <p class="truncate text-xs font-medium text-gray-500">{{ label }}</p>
        <p class="text-2xl font-semibold text-gray-900">{% if prefix %}{{ prefix }} {% endif %}{{ value }}</p>
        {% if trend %}
            <p class="mt-0.5 text-xs font-medium {% if trend_direction == 'down' %}stat-trend-down{% else %}stat-trend-up{% endif %}">
                {{ trend }}{% if trend_label %} <span class="font-normal text-gray-400">{{ trend_label }}</span>{% endif %}
            </p>
        {% endif %}
    </div>
{% if href %}</a>{% else %}</div>{% endif %}
