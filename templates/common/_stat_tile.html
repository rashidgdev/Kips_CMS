{% load icons %}
<div class="stat-tile">
    <span class="stat-icon {{ color|default:'bg-blue-50 text-blue-700' }}">
        {% icon icon 'h-5 w-5' %}
    </span>
    <div class="min-w-0">
        <p class="truncate text-xs font-medium text-gray-500">{{ label }}</p>
        <p class="text-2xl font-semibold text-gray-900">{% if prefix %}{{ prefix }} {% endif %}{{ value }}</p>
    </div>
</div>
