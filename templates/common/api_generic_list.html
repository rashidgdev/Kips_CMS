{% extends 'base.html' %}
{% load static %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
<div id="page-messages"></div>
<div class="mb-6 flex flex-wrap items-center justify-between gap-2">
    <h1 class="text-2xl font-semibold text-gray-900">{{ page_title }}</h1>
    <div class="flex flex-wrap items-center gap-2" id="crud-actions"></div>
</div>

<div id="crud-search-root"></div>
<div class="card page-enter" id="crud-list-root"></div>

<script src="{% static 'js/core/api.js' %}"></script>
<script src="{% static 'js/core/crud.js' %}"></script>
<script>
    KipsCrud.renderList({{ crud_config|safe }});
</script>
{% endblock %}
